aid: proof-of-play
name: Proof of Play
description: >-
  Proof of Play is an a16z-backed gaming studio and on-chain infrastructure
  company, founded by Amitt Mahajan and best known for the fully on-chain RPG
  Pirate Nation. It builds a platform for high-performance, serverless on-chain
  applications and games, exposing a set of developer services: a verified
  random number generator (vRNG) for fast, secure on-chain randomness; a
  Marketplace API for peer-to-peer trading across on-chain and off-chain
  inventory; an on-chain NoSQL Entity-Component-System (ECS) database and
  indexer; token mirroring to replicate NFT ownership data across chains; a
  gasless relayer; and multichain scaling. Documentation and a public OpenAPI
  are published at docs.proofofplay.com, and much of the stack is progressively
  open-sourced under MIT on GitHub.
